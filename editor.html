<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>セトリ管理 | FREE LIVE ARCHIVE</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#26372e;background:#f8f6f1}*{box-sizing:border-box}body{max-width:680px;margin:auto;padding:24px 16px 70px}h1{font-size:1.6rem;margin:6px 0 12px}h2{font-size:1.2rem;margin:0 0 12px}.panel{background:white;border:1px solid #d8dfd8;border-radius:14px;padding:18px;margin:18px 0}p,small{line-height:1.6}.muted,small{color:#65736b}label{display:block;font-weight:650;margin:14px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #b9c8bf;border-radius:9px;font:inherit;background:white;color:#26372e}textarea{min-height:170px;resize:vertical}button{border:0;border-radius:10px;background:#315c45;color:white;padding:13px 17px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e6ece7;color:#234534}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.actions>*{flex:1}.hidden{display:none!important}#status{white-space:pre-wrap;background:#eef3ec;border-radius:10px;padding:12px;line-height:1.5}a{color:#315c45}
</style>
</head>
<body>
<small>FREE LIVE ARCHIVE / 管理者用</small><h1>セトリ登録・修正</h1><p class="muted">犬専用の管理画面。保存するとSupabaseに反映され、公開サイトにも再読み込みで反映されます。</p>
<div id="status" role="status" aria-live="polite">接続を準備しています…</div>
<section id="loginPanel" class="panel hidden"><h2>管理者ログイン</h2><form id="loginForm"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button id="loginButton" type="submit">ログイン</button></div></form><small>パスワードはこの画面内のログイン処理にのみ使用します。ブラウザに独自保存しません。</small></section>
<section id="editorPanel" class="hidden"><div class="panel"><h2>登録済みライブ</h2><label for="existing">編集対象を選択</label><select id="existing"><option value="">新しいライブを登録</option></select><div class="actions"><button type="button" id="newButton" class="secondary">新規登録に戻る</button><button type="button" id="reloadButton" class="secondary">一覧を更新</button><button type="button" id="logoutButton" class="secondary">ログアウト</button></div></div>
<form id="setlistForm" class="panel"><h2 id="formHeading">新規登録</h2><label for="date">開催日 *</label><input id="date" type="date" required><label for="venue">会場</label><input id="venue" placeholder="会場名"><label for="songs">セットリスト（1行に1曲、演奏順）</label><textarea id="songs" placeholder="1曲目&#10;2曲目&#10;3曲目"></textarea><div class="actions"><button id="saveButton" type="submit">公開データに保存</button></div></form>
<p><a href="./index.html">公開サイトを見る</a></p></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const ADMIN_ID='b2a7b4a6-fa71-4708-914a-8117129c660e';
let base='',key='',token='',rows=[],selected='';
function message(s){$('status').textContent=s}
function busy(el,flag){el.disabled=flag}
async function request(url,opts={}){const response=await fetch(url,opts);let result;try{result=await response.json()}catch{result=null}if(!response.ok){throw Error(result?.msg||result?.message||result?.error_description||result?.error||`HTTP ${response.status}`)}return result}
function headers(authorized=false){return {'apikey':key,'Content-Type':'application/json',...(authorized?{'Authorization':`Bearer ${token}`}:{})}}
async function init(){try{
// 公開サイトと同じSupabase接続設定を app.js から取得する（秘密鍵は使用しない）
const response=await fetch('./app.js',{cache:'no-store'});if(!response.ok)throw Error('app.js を取得できません');const js=await response.text();
const urlMatch=js.match(/\b(?:const|let|var)\s+SUPABASE_URL\s*=\s*['"]([^'"]+)['"]/);
const keyMatch=js.match(/\b(?:const|let|var)\s+SUPABASE_KEY\s*=\s*['"]([^'"]+)['"]/);
if(!urlMatch||!keyMatch)throw Error('app.js に SUPABASE_URL / SUPABASE_KEY が見つかりません');
base=urlMatch[1].replace(/\/$/,'');key=keyMatch[1];if(!base.startsWith('https://')||!key.startsWith('sb_publishable_'))throw Error('接続設定を確認してください（publishable key が必要です）');
$('loginPanel').classList.remove('hidden');message('接続準備OK。管理者アカウントでログインしてください。');
}catch(e){message('接続準備に失敗しました：'+e.message+'\nGitHub Pagesの公開URLから開いているか確認してください。')}}
function clear(){selected='';$('setlistForm').reset();$('existing').value='';$('formHeading').textContent='新規登録'}
function choose(id){selected=id;const r=rows.find(x=>String(x.id)===id);if(!r){clear();return}$('date').value=r.live_date||'';$('venue').value=r.venue||'';$('songs').value=r.songs||'';$('formHeading').textContent='登録済みライブの修正'}
async function load(){const data=await request(`${base}/rest/v1/live_setlists?select=id,live_date,venue,songs&order=live_date.desc`,{headers:headers(true)});rows=data||[];const current=selected;$('existing').replaceChildren(new Option('新しいライブを登録',''));for(const r of rows)$('existing').add(new Option(`${r.live_date} / ${r.venue||'会場未登録'}`,String(r.id)));if(current&&rows.some(r=>String(r.id)===current)){$('existing').value=current;choose(current)}else clear();message(`ログイン中。${rows.length}件のライブを読み込みました。`)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('loginButton');busy(button,true);try{const data=await request(`${base}/auth/v1/token?grant_type=password`,{method:'POST',headers:headers(),body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const user=await request(`${base}/auth/v1/user`,{headers:{...headers(),Authorization:`Bearer ${data.access_token}`}});if(user.id!==ADMIN_ID)throw Error('このアカウントには管理権限がありません');token=data.access_token;$('password').value='';$('loginPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');await load()}catch(err){token='';message('ログインできません：'+err.message)}finally{busy(button,false)}});
$('existing').addEventListener('change',e=>choose(e.target.value));$('newButton').addEventListener('click',()=>{clear();message('新規登録モードです。')});$('reloadButton').addEventListener('click',async()=>{try{await load()}catch(err){message('読み込み失敗：'+err.message)}});
$('logoutButton').addEventListener('click',()=>{token='';rows=[];clear();$('editorPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');message('ログアウトしました。')});
$('setlistForm').addEventListener('submit',async e=>{e.preventDefault();if(!token){message('再ログインしてください');return}const date=$('date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){message('開催日を入力してください');return}const payload={live_date:date,venue:$('venue').value.trim(),songs:$('songs').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).join('\n')};if(!payload.songs){message('セットリストを入力してください');return}const button=$('saveButton');busy(button,true);try{const editing=Boolean(selected);const url=`${base}/rest/v1/live_setlists${editing?`?id=eq.${encodeURIComponent(selected)}`:''}`;const response=await fetch(url,{method:editing?'PATCH':'POST',headers:{...headers(true),Prefer:'return=representation'},body:JSON.stringify(payload)});const result=await response.json().catch(()=>null);if(!response.ok)throw Error(result?.message||result?.error||`HTTP ${response.status}`);if(!Array.isArray(result)||result.length!==1)throw Error('保存件数が確認できませんでした');selected=String(result[0].id);await load();message(`保存成功！ ${editing?'修正':'新規登録'}を公開データに反映しました。公開サイトを再読み込みして確認してください。`)}catch(err){message('保存失敗：'+err.message)}finally{busy(button,false)}});
init();
})();
</script>
</body></html>
